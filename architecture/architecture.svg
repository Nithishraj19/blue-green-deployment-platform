<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Docker Blue-Green Deployment Architecture</title><desc id="desc">GitHub triggers Jenkins tests and Docker builds. Versioned frontend and backend images go to a registry. Jenkins deploys the inactive Docker Compose color, checks health and versions, then switches Nginx traffic; failed validation restores the prior route.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263c58"/></marker><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#486581}.head{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:700}.body{font-size:14px;fill:#486581}.small{font-size:12px;fill:#486581}.edge{stroke:#263c58;stroke-width:3;fill:none;marker-end:url(#a)}.card{fill:#fff;stroke:#9fb3c8;stroke-width:1.5;rx:14}</style></defs>
<rect width="1600" height="1000" fill="#f4f7fb"/><text x="42" y="54" class="title">Blue-Green Deployment Architecture</text><text x="43" y="82" class="sub">Node.js frontend · Docker Compose backend services · Nginx traffic control</text>
<!-- pipeline -->
<rect x="32" y="105" width="1536" height="175" rx="18" fill="#fff" stroke="#b8c7d6"/><text x="58" y="137" class="head">CI/CD and image publishing</text>
<rect x="60" y="155" width="220" height="88" class="card"/><circle cx="99" cy="193" r="24" fill="#172b4d"/><text x="99" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="white">GH</text><text x="137" y="190" class="label">GitHub</text><text x="83" y="224" class="body">Code push</text><path d="M285 199H345" class="edge"/>
<rect x="355" y="155" width="320" height="88" rx="14" fill="#e9f2ff" stroke="#4c9aff" stroke-width="2"/><text x="380" y="188" class="label">Jenkins pipeline</text><text x="380" y="216" class="body">Test · Docker build · push · deploy</text><path d="M680 199H745" class="edge"/>
<rect x="755" y="155" width="275" height="88" class="card"/><path d="M780 196h40v25h-40zM787 188v25M794 180v25" fill="none" stroke="#1683c4" stroke-width="3"/><text x="835" y="190" class="label">Docker Registry</text><text x="835" y="217" class="body">frontend:tag · backend:tag</text><path d="M1035 199H1095" class="edge"/><rect x="1105" y="155" width="400" height="88" rx="14" fill="#f3f0ff" stroke="#998dd9"/><text x="1130" y="190" class="label">Candidate release gate</text><text x="1130" y="218" class="body">Inactive color → health/version → Nginx switch</text>
<!-- environments -->
<rect x="32" y="305" width="1110" height="445" rx="20" fill="#f0f7ff" stroke="#2684ff" stroke-width="2"/><rect x="55" y="322" width="325" height="42" rx="18" fill="#1265b3"/><text x="217" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="white">Blue Docker Compose environment</text><text x="405" y="350" class="body">one release · independent containers · private app network</text>
<rect x="55" y="382" width="230" height="105" rx="14" fill="white" stroke="#4c9aff" stroke-width="1.5"/><text x="78" y="414" class="label">Node.js Frontend</text><text x="78" y="441" class="body">blue · /health · /version</text><text x="78" y="464" class="small">routes to api-blue</text>
<rect x="315" y="382" width="230" height="105" rx="14" fill="white" stroke="#4c9aff" stroke-width="1.5"/><text x="338" y="414" class="label">API Server</text><text x="338" y="441" class="body">blue release · health gate</text><text x="338" y="464" class="small">checks downstream services</text>
<rect x="575" y="382" width="230" height="105" rx="14" fill="white" stroke="#4c9aff" stroke-width="1.5"/><text x="598" y="414" class="label">Catalog Service</text><text x="598" y="441" class="body">blue release</text><text x="598" y="464" class="small">backend container</text>
<rect x="835" y="382" width="230" height="105" rx="14" fill="white" stroke="#4c9aff" stroke-width="1.5"/><text x="858" y="414" class="label">Billing Service</text><text x="858" y="441" class="body">blue release</text><text x="858" y="464" class="small">backend container</text>
<path d="M285 435H307M545 435H567M805 435H827" class="edge"/>
<rect x="55" y="514" width="1010" height="48" rx="12" fill="#dcecff"/><text x="78" y="544" class="body">Blue image versions remain available while green is updated; each color has its own API and services.</text>
<rect x="32" y="590" width="1110" height="140" rx="20" fill="#f0fff4" stroke="#36b37e" stroke-width="2"/><rect x="55" y="606" width="325" height="42" rx="18" fill="#16864b"/><text x="217" y="634" text-anchor="middle" font-size="17" font-weight="700" fill="white">Green Docker Compose environment</text><text x="405" y="634" class="body">inactive candidate or active release</text>
<rect x="55" y="660" width="230" height="52" rx="12" fill="white" stroke="#36b37e"/><text x="75" y="692" class="label">Frontend · green</text><rect x="315" y="660" width="230" height="52" rx="12" fill="white" stroke="#36b37e"/><text x="335" y="692" class="label">API · green</text><rect x="575" y="660" width="230" height="52" rx="12" fill="white" stroke="#36b37e"/><text x="595" y="692" class="label">Catalog · green</text><rect x="835" y="660" width="230" height="52" rx="12" fill="white" stroke="#36b37e"/><text x="855" y="692" class="label">Billing · green</text>
<!-- router -->
<rect x="1190" y="370" width="345" height="122" rx="18" fill="#eee9ff" stroke="#6554c0" stroke-width="2"/><text x="1362" y="409" text-anchor="middle" class="head">Nginx Reverse Proxy</text><text x="1362" y="440" text-anchor="middle" class="body">only public application entry point</text><text x="1362" y="466" text-anchor="middle" class="small">active.conf selects one frontend</text>
<rect x="1262" y="310" width="200" height="42" rx="18" class="card"/><text x="1362" y="337" text-anchor="middle" class="label">Users / Clients</text><path d="M1362 355V362" class="edge"/>
<path d="M1145 435H1180" class="edge"/><text x="1146" y="420" class="small">100% active</text><path d="M1145 684H1175V622H1180" fill="none" stroke="#35a66a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="1146" y="671" class="small">candidate health check</text>
<rect x="1190" y="514" width="345" height="216" rx="16" fill="white" stroke="#998dd9"/><text x="1215" y="549" class="label">Switch and rollback</text><text x="1215" y="580" class="body">1. Validate candidate health + version</text><text x="1215" y="608" class="body">2. Test Nginx config, then reload</text><text x="1215" y="636" class="body">3. Verify public route and version</text><text x="1215" y="680" class="body" fill="#bf2600">Failure → restore previous upstream</text>
<!-- release flow -->
<rect x="32" y="775" width="1536" height="190" rx="18" fill="#fff" stroke="#b8c7d6"/><text x="55" y="808" class="head">Release flow</text>
<g font-size="14" text-anchor="middle"><rect x="55" y="830" width="220" height="100" rx="12" fill="#e9f2ff" stroke="#4c9aff"/><text x="165" y="861" class="label">1 · Build + push</text><text x="165" y="887" class="body">Frontend and backend tags</text><text x="165" y="910" class="body">to registry</text><path d="M278 880H310" class="edge"/><rect x="320" y="830" width="220" height="100" rx="12" fill="#e9f2ff" stroke="#4c9aff"/><text x="430" y="861" class="label">2 · Deploy inactive</text><text x="430" y="887" class="body">Keep active color serving</text><text x="430" y="910" class="body">live traffic</text><path d="M543 880H575" class="edge"/><rect x="585" y="830" width="220" height="100" rx="12" fill="#e9f2ff" stroke="#4c9aff"/><text x="695" y="861" class="label">3 · Health gate</text><text x="695" y="887" class="body">Frontend, API, services</text><text x="695" y="910" class="body">health + version</text><path d="M808 880H840" class="edge"/><rect x="850" y="830" width="220" height="100" rx="12" fill="#e3fcef" stroke="#36b37e"/><text x="960" y="861" class="label">4 · Switch + verify</text><text x="960" y="887" class="body">Nginx reload and public</text><text x="960" y="910" class="body">route check</text><path d="M1073 880H1105" class="edge"/><rect x="1115" y="830" width="220" height="100" rx="12" fill="#fff4e5" stroke="#ffab00"/><text x="1225" y="861" class="label">5 · Roll back if needed</text><text x="1225" y="887" class="body">Restore previous route</text><text x="1225" y="910" class="body">on failed validation</text></g><text x="55" y="951" class="small">Local-first Docker Compose demonstration. Jenkins and registry credentials are configured out of band. No AWS or Kubernetes deployment.</text></svg>
