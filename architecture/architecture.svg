<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">Blue-Green Deployment Platform</title><desc id="desc">Jenkins tests and builds an image, deploys it to the inactive Kubernetes color, checks health, then switches the Service selector. The previous color remains ready for rollback.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344563"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:bold}.sub{font-size:17px;fill:#526581}.section{font-size:20px;font-weight:bold}.label{font-size:16px;font-weight:bold}.body{font-size:14px;fill:#526581}.box{fill:#fff;stroke:#aab3c2;stroke-width:2;rx:14}.arrow{stroke:#344563;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="920" fill="#f7f8fa"/><text x="55" y="60" class="title">Blue-Green Deployment Platform</text><text x="56" y="91" class="sub">Build, validate the inactive release, switch traffic, and keep the previous color ready for rollback</text>
<rect x="45" y="125" width="1410" height="210" rx="18" fill="#fff" stroke="#c1c7d0"/><text x="70" y="160" class="section">Jenkins delivery pipeline</text>
<rect x="75" y="190" width="220" height="100" class="box"/><circle cx="110" cy="226" r="22" fill="#172b4d"/><text x="110" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="white">GH</text><text x="145" y="225" class="label">GitHub</text><text x="95" y="267" class="body">Source + pipeline</text><path d="M300 240H360" class="arrow"/>
<rect x="370" y="190" width="345" height="100" rx="14" fill="#e9f2ff" stroke="#4c9aff" stroke-width="2"/><text x="395" y="225" class="label">Jenkins CI/CD</text><text x="395" y="253" class="body">Tests → build immutable image → push</text><text x="395" y="275" class="body">Registry credential supplied by Jenkins</text><path d="M720 240H790" class="arrow"/>
<rect x="800" y="190" width="290" height="100" class="box"/><path d="M825 245h42v28h-42zM832 237v28M839 229v28" fill="none" stroke="#344563" stroke-width="3"/><text x="885" y="230" class="label">OCI registry</text><text x="885" y="258" class="body">Versioned image tag</text><text x="1150" y="220" class="label">Promotion gate</text><text x="1150" y="250" class="body">Rollout + health + version</text><text x="1150" y="274" class="body">Then switch Service selector</text>
<rect x="45" y="370" width="1410" height="500" rx="20" fill="#f0f6ff" stroke="#4c9aff" stroke-width="2"/><rect x="70" y="390" width="280" height="40" rx="18" fill="#0747a6"/><text x="210" y="417" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Kubernetes · local Kind</text><text x="380" y="417" class="body">Namespace blue-green · no cloud resources</text>
<rect x="90" y="590" width="190" height="100" class="box"/><text x="115" y="630" class="label">In-cluster clients</text><text x="115" y="660" class="body">demo-app:80</text><path d="M285 640H365" class="arrow"/>
<rect x="375" y="540" width="280" height="200" rx="16" fill="white" stroke="#0052cc" stroke-width="2"/><rect x="375" y="540" width="280" height="45" rx="14" fill="#deebff"/><text x="395" y="570" class="label">Stable ClusterIP Service</text><text x="397" y="615" class="body">demo-app · port 80</text><text x="397" y="650" class="body">selector: track = green</text><text x="397" y="700" class="body">Only selected color gets traffic</text><path d="M655 640H710V535H770" class="arrow"/><path d="M710 640V745H770" class="arrow"/>
<rect x="780" y="480" width="340" height="130" rx="15" fill="white" stroke="#4c9aff" stroke-width="2"/><rect x="780" y="480" width="340" height="38" rx="13" fill="#deebff"/><text x="802" y="506" class="label">Blue Deployment · previous</text><text x="802" y="545" class="body">2 replicas · ready for rollback</text><text x="802" y="580" class="body">Pod blue · Pod blue</text>
<rect x="780" y="680" width="340" height="130" rx="15" fill="white" stroke="#36b37e" stroke-width="2"/><rect x="780" y="680" width="340" height="38" rx="13" fill="#e3fcef"/><text x="802" y="706" class="label">Green Deployment · candidate/active</text><text x="802" y="745" class="body">2 replicas · startup/readiness/liveness</text><text x="802" y="780" class="body">Pod green · Pod green</text>
<rect x="1160" y="480" width="250" height="330" rx="15" fill="white" stroke="#6554c0" stroke-width="2"/><text x="1185" y="520" class="label">Jenkins release gate</text><text x="1185" y="555" class="body">1. Deploy inactive color</text><text x="1185" y="585" class="body">2. Wait for rollout ready</text><text x="1185" y="615" class="body">3. Probe health + version</text><text x="1185" y="645" class="body">4. Patch Service selector</text><path d="M1185 670h200" stroke="#dfe1e6"/><text x="1185" y="710" class="label" fill="#bf2600">Rollback</text><text x="1185" y="740" class="body">Failed post-switch check?</text><text x="1185" y="770" class="body">Restore prior selector.</text><path d="M950 290V350H1260V470" fill="none" stroke="#344563" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="78" y="840" class="body">Local Kind portfolio demonstration. No AWS deployment. See README for setup and Jenkins prerequisites.</text></svg>
