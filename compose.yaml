name: blue-green-platform
x-app-health: &app-health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s
services:
  frontend-blue:
    image: ${FRONTEND_IMAGE:-bluegreen/frontend:local}
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      PORT: "8080"
      APP_COLOR: blue
      APP_VERSION: ${VERSION:-local}
      API_URL: http://api-blue:8081
    depends_on: {api-blue: {condition: service_healthy}}
    healthcheck: *app-health
    networks: [app]
  api-blue:
    image: ${BACKEND_IMAGE:-bluegreen/backend:local}
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PORT: "8081"
      APP_ROLE: api
      APP_COLOR: blue
      APP_VERSION: ${VERSION:-local}
      SERVICE_A_URL: http://catalog-blue:8081
      SERVICE_B_URL: http://billing-blue:8081
    depends_on: {catalog-blue: {condition: service_healthy}, billing-blue: {condition: service_healthy}}
    healthcheck: *app-health
    networks: [app]
  catalog-blue:
    image: ${BACKEND_IMAGE:-bluegreen/backend:local}
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PORT: "8081"
      APP_ROLE: catalog
      APP_COLOR: blue
      APP_VERSION: ${VERSION:-local}
    healthcheck: *app-health
    networks: [app]
  billing-blue:
    image: ${BACKEND_IMAGE:-bluegreen/backend:local}
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PORT: "8081"
      APP_ROLE: billing
      APP_COLOR: blue
      APP_VERSION: ${VERSION:-local}
    healthcheck: *app-health
    networks: [app]
  frontend-green:
    image: ${FRONTEND_IMAGE:-bluegreen/frontend:local}
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      PORT: "8080"
      APP_COLOR: green
      APP_VERSION: ${VERSION:-local}
      API_URL: http://api-green:8081
    depends_on: {api-green: {condition: service_healthy}}
    healthcheck: *app-health
    networks: [app]
  api-green:
    image: ${BACKEND_IMAGE:-bluegreen/backend:local}
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PORT: "8081"
      APP_ROLE: api
      APP_COLOR: green
      APP_VERSION: ${VERSION:-local}
      SERVICE_A_URL: http://catalog-green:8081
      SERVICE_B_URL: http://billing-green:8081
    depends_on: {catalog-green: {condition: service_healthy}, billing-green: {condition: service_healthy}}
    healthcheck: *app-health
    networks: [app]
  catalog-green:
    image: ${BACKEND_IMAGE:-bluegreen/backend:local}
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PORT: "8081"
      APP_ROLE: catalog
      APP_COLOR: green
      APP_VERSION: ${VERSION:-local}
    healthcheck: *app-health
    networks: [app]
  billing-green:
    image: ${BACKEND_IMAGE:-bluegreen/backend:local}
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PORT: "8081"
      APP_ROLE: billing
      APP_COLOR: green
      APP_VERSION: ${VERSION:-local}
    healthcheck: *app-health
    networks: [app]
  reverse-proxy:
    image: nginx:1.27-alpine
    ports: ["${PROXY_PORT:-8080}:80"]
    volumes: [./proxy/nginx.conf:/etc/nginx/nginx.conf:ro, ./proxy/conf.d:/etc/nginx/conf.d:ro]
    depends_on: [frontend-blue, frontend-green]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"], interval: 5s, timeout: 3s, retries: 12}
    networks: [app]
networks:
  app: {}
